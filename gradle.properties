# D65: پرچم deterministicdebugging، R8 را تک‌رشته‌ای می‌کند. R8 نسخهٔ 8.7 (همراه AGP 8.7.3)
# در ادغام افقی کلاس‌ها race دارد (b/434861604، در 8.10.31 به بعد رفع شده): سازندهٔ
# تازه گاهی به پروفایل بازنویسی‌شده می‌رود و گاهی نه، و baseline.prof دو ساخت از یک
# کامیت فرق می‌کند. R8 داخل daemon گریدل اجرا می‌شود، پس پرچم باید همین‌جا باشد.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.deterministicdebugging=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
