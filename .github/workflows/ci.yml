name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# :benchmark و :baselineprofile (D63) عمداً اینجا نیستند. طبق خودِ D63،
# runnerهای این CI گوشی واقعی ندارند و شبیه‌ساز برای زمان‌بندی سرد قابل
# اعتماد نیست؛ عدد اصل ۷ باید دستی روی گوشی مرجع سنجیده شود. این ماژول‌ها
# فقط با دستور دستی اجرا می‌شوند:
#   ./gradlew :benchmark:connectedBenchmarkReleaseAndroidTest   (سنجش کارایی)
#   ./gradlew :app:generateBaselineProfile                      (تازه‌سازی پروفایل)
# جزئیات و اعداد واقعی اندازه‌گیری‌شده در docs/STATUS.md، بخش M9.

jobs:
  # ماژول‌های خالص Kotlin: مدل، فارسی و طبقه‌بند. اینجا معیارهای طبقه‌بند و
  # قاعدهٔ «اول ذخیره» آزموده می‌شوند (D64).
  core:
    name: آزمون‌های هسته
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: اجرای آزمون‌های واحد
        run: ./gradlew --no-daemon :core:model:test :core:persian:test :core:classifier:test :core:mms:test

      # D62: فقط کد تازه سنجیده می‌شود؛ وضع موجود در config/detekt/baseline.xml است.
      - name: detekt
        run: ./gradlew --no-daemon :detekt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-reports
          path: core/*/build/reports/tests/

  # ساخت اپ اندرویدی و بررسی‌های اجباری D62.
  android:
    name: ساخت اپ و بررسی NoNet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # بستهٔ قدیمی `tools` دیگر در مخزن گوگل نیست و پیش‌فرض این action را
      # می‌شکند. خود runner اندروید SDK را دارد، پس فقط مجوزها و متغیرها لازم است.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: ساخت نسخهٔ debug
        run: ./gradlew --no-daemon :app:assembleDebug

      # ADR-0002: بررسی روی manifest ادغام‌شدهٔ **هر دو** نسخه انجام می‌شود، چون
      # ممکن است یک کتابخانه، حتی فقط در release، بی‌صدا مجوز INTERNET را اضافه کند.
      - name: بررسی نبود مجوز INTERNET
        run: ./gradlew --no-daemon :app:checkDebugPermissions :app:checkReleasePermissions

      # schema هر نسخهٔ پایگاه داده باید در مخزن باشد (هیچ migration مخربی
      # نداریم). Room آن را هنگام ساخت تولید می‌کند؛ اگر با نسخهٔ داخل مخزن
      # فرق داشته باشد، یعنی یک تغییر schema بدون ثبت شدن رد شده است.
      - name: schema پایگاه داده با کد یکی است
        run: |
          new=$(git ls-files --others --exclude-standard core/data/schemas)
          if [ -n "$new" ]; then
            echo "schema تازه‌ای ساخته شد و در مخزن نیست:"
            for file in $new; do
              echo "--- $file"
              cat "$file"
            done
            exit 1
          fi
          git diff --exit-code -- core/data/schemas

      - name: آزمون‌های واحد لایهٔ داده و تلفن
        run: ./gradlew --no-daemon :core:data:testDebugUnitTest :core:telephony:testDebugUnitTest

      - name: lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: گزارش کامل lint
        if: failure()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          [ -f "$report" ] && cat "$report" || echo "گزارش lint ساخته نشد"

      # اصل ۷ دربارهٔ APKی است که به کاربر می‌رسد، یعنی release. نسخهٔ debug
      # کتابخانه‌های دیباگ Compose را هم دارد و معیار درستی نیست.
      - name: ساخت نسخهٔ release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: حجم APK زیر ۱۰ مگابایت
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "APK نسخهٔ release پیدا نشد"
            exit 1
          fi
          size=$(stat -c%s "$apk")
          echo "حجم APK نسخهٔ release ($apk): $((size / 1024)) کیلوبایت"
          if [ "$size" -gt 10485760 ]; then
            echo "حجم APK از بودجهٔ ۱۰ مگابایت (اصل ۷) بیشتر است"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: app/build/reports/

  # D64: آزمون ابزاری مسیر دریافت روی شبیه‌ساز. پیامک واقعاً از مودم شبیه‌ساز
  # می‌رسد و ثابت می‌شود در provider و index.db هست، حتی با طبقه‌بند خراب
  # (ADR-0003). جزئیات در scripts/ci/receive-test.sh.
  receive:
    name: آزمون دریافت روی شبیه‌ساز
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: فعال کردن KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ساخت APK اپ و آزمون
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: دریافت پیامک، عادی و با طبقه‌بند خراب
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci/receive-test.sh

  # D65 (ROADMAP B5): build بازتولیدپذیر. نسخهٔ release دو بار، روی دو runner جدا و
  # بدون کش Gradle، از همین کامیت ساخته می‌شود و دو APK بدون امضا باید بایت‌به‌بایت
  # یکی باشند. اگر نبودند، diffoscope تفاوت را در لاگ و artifact نشان می‌دهد.
  reproducible-build:
    name: ساخت release (${{ matrix.copy }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: ساخت نسخهٔ release بدون کش
        run: ./gradlew --no-daemon --no-build-cache :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.copy }}
          path: app/build/outputs/apk/release/*.apk

  reproducible:
    name: بازتولیدپذیری APK
    needs: reproducible-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*

      - name: دو APK یکی‌اند
        run: |
          a=$(find release-a -name '*.apk' | head -1)
          b=$(find release-b -name '*.apk' | head -1)
          sha256sum "$a" "$b"
          if cmp -s "$a" "$b"; then
            echo "دو ساخت مستقل بایت‌به‌بایت یکی‌اند"
            exit 0
          fi
          echo "دو ساخت از یک کامیت فرق دارند (D65)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope >/dev/null
          diffoscope --text diffoscope.txt --max-report-size 2000000 "$a" "$b" || true
          head -300 diffoscope.txt
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diffoscope
          path: diffoscope.txt
