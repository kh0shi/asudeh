# D61: mirror خودکار مخزن روی Codeberg، تا اگر روزی GitHub در دسترس نبود
# انتقال آسان باشد. توکن از secret `CODEBERG_TOKEN` خوانده می‌شود (ROADMAP ⚑ U6)؛
# بدون آن، workflow بی‌صدا رد می‌شود. نشانی مخزن مقصد از متغیر `CODEBERG_REPO`
# (مثل `kh0shi/asudeh`) می‌آید و پیش‌فرضش همان نام مخزن روی GitHub است.
name: mirror

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  codeberg:
    name: mirror روی Codeberg
    runs-on: ubuntu-latest
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_REPO: ${{ vars.CODEBERG_REPO || github.repository }}
    steps:
      - name: بررسی توکن
        id: token
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "secret CODEBERG_TOKEN تنظیم نشده؛ mirror رد شد."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: گرفتن همهٔ شاخه‌ها و برچسب‌ها
        if: steps.token.outputs.present == 'true'
        run: |
          git clone --bare "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo.git

      # `--mirror` خام refs/pull/* گیت‌هاب را هم می‌فرستد که Codeberg رد می‌کند؛
      # پس فقط شاخه‌ها و برچسب‌ها، با همان رفتار mirror (بازنویسی و حذف).
      - name: فرستادن به Codeberg
        if: steps.token.outputs.present == 'true'
        working-directory: repo.git
        run: |
          owner="${CODEBERG_REPO%%/*}"
          git push --prune \
            "https://${owner}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
